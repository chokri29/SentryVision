<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentryVision — AI Pre-Audit</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --panel-2: #18212b;
      --border: #243041;
      --text: #e8eef6;
      --muted: #9aa8b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --cyan: #22d3ee;
      --critical: #f87171;
      --high: #fb923c;
      --medium: #fbbf24;
      --low: #38bdf8;
      --info: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #132033 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    header { margin-bottom: 22px; }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .samples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .samples button {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .samples button:hover { border-color: var(--accent); color: #fff; }

    textarea {
      width: 100%;
      min-height: 210px;
      resize: vertical;
      background: #0d131a;
      color: #7dd3c7;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      background: linear-gradient(180deg, var(--accent), var(--accent-hover));
      color: white;
      font-weight: 700;
      font-size: 0.98rem;
    }
    .primary-btn:hover { filter: brightness(1.05); }
    .primary-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: none;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .status.loading {
      display: block;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.25);
      color: var(--cyan);
    }
    .status.error {
      display: block;
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.28);
      color: #fecaca;
    }

    #results { display: none; margin-top: 18px; }

    .summary {
      background: linear-gradient(180deg, #15202c, var(--panel));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .summary h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      color: #dbe7f5;
    }
    .summary p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.94rem;
    }

    .finding {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .finding-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .finding-top h3 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-critical { background: rgba(248,113,113,.15); color: var(--critical); border: 1px solid rgba(248,113,113,.3); }
    .badge-high { background: rgba(251,146,60,.15); color: var(--high); border: 1px solid rgba(251,146,60,.3); }
    .badge-medium { background: rgba(251,191,36,.14); color: var(--medium); border: 1px solid rgba(251,191,36,.28); }
    .badge-low { background: rgba(56,189,248,.14); color: var(--low); border: 1px solid rgba(56,189,248,.28); }
    .badge-info { background: rgba(148,163,184,.14); color: var(--info); border: 1px solid rgba(148,163,184,.25); }

    .field { margin-bottom: 10px; }
    .field strong {
      display: block;
      font-size: 0.78rem;
      color: #b7c6d6;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .diagram-wrap {
      margin-top: 12px;
      background: #0d131a;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
      padding: 14px;
    }
    .diagram-wrap .mermaid-output {
      display: flex;
      justify-content: center;
      min-height: 120px;
    }
    .diagram-wrap svg {
      max-width: 100%;
      height: auto;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px 10px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    footer {
      margin-top: 18px;
      color: #6b7a8c;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body data-backend-url="">
  <div class="wrap">
    <header>
      <h1>🛡️ SentryVision</h1>
      <p>AI-assisted pre-audit triage for developers and non-technical founders. Paste a Solidity contract to get plain-language findings and visual exploit flows.</p>
    </header>

    <section class="panel">
      <div class="samples">
        <button type="button" onclick="loadSample('reentrancy')">Sample: Reentrancy</button>
        <button type="button" onclick="loadSample('access')">Sample: Access Control</button>
        <button type="button" onclick="loadSample('unchecked')">Sample: Unchecked Call</button>
      </div>

      <textarea id="solidityInput" placeholder="pragma solidity ^0.8.0;&#10;&#10;contract YourContract { ... }"></textarea>

      <button id="analyzeBtn" class="primary-btn" onclick="analyzeContract()">Run AI Audit</button>
      <div id="status" class="status"></div>
    </section>

    <section id="results">
      <div class="summary">
        <h2>Audit Summary</h2>
        <p id="summaryText"></p>
      </div>
      <div id="findings"></div>
    </section>

    <footer>
      Prototype for the Meta AI Developer Hackathon · Not a formal security audit
    </footer>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });

    const SAMPLES = {
      reentrancy: `// SPDX-License-Identifier: MIT\npragma solidity ^0.8.0;\n\ncontract VulnerableBank {\n    mapping(address => uint256) public balances;\n\n    function deposit() external payable {\n        balances[msg.sender] += msg.value;\n    }\n\n    function withdraw(uint256 amount) external {\n        require(balances[msg.sender] >= amount, "Insufficient balance");\n        (bool success, ) = msg.sender.call{value: amount}("");\n        require(success, "Transfer failed");\n        balances[msg.sender] -= amount;\n    }\n}`,
      access: `// SPDX-License-Identifier: MIT\npragma solidity ^0.8.0;\n\ncontract OpenVault {\n    address public owner;\n    mapping(address => uint256) public deposits;\n\n    constructor() {\n        owner = msg.sender;\n    }\n\n    function deposit() external payable {\n        deposits[msg.sender] += msg.value;\n    }\n\n    // Missing onlyOwner / access control\n    function emergencyWithdraw(address to, uint256 amount) external {\n        (bool ok, ) = to.call{value: amount}("");\n        require(ok, "transfer failed");\n    }\n}`,
      unchecked: `// SPDX-License-Identifier: MIT\npragma solidity ^0.8.0;\n\ncontract Payout {\n    mapping(address => uint256) public owed;\n\n    function setOwed(address user, uint256 amount) external {\n        owed[user] = amount;\n    }\n\n    function claim() external {\n        uint256 amount = owed[msg.sender];\n        // Unchecked external call; no success check, state updated after\n        msg.sender.call{value: amount}("");\n        owed[msg.sender] = 0;\n    }\n}`
    };

    function loadSample(key) {
      document.getElementById('solidityInput').value = SAMPLES[key] || '';
      clearStatus();
      document.getElementById('results').style.display = 'none';
    }

    document.getElementById('solidityInput').value = SAMPLES.reentrancy;

    function getBackendUrl() {
      const override = document.body.dataset.backendUrl;
      if (override && override.trim()) return override.trim();
      return '/analyze';
    }

    function clearStatus() {
      const el = document.getElementById('status');
      el.className = 'status';
      el.textContent = '';
    }

    function showStatus(type, message) {
      const el = document.getElementById('status');
      el.className = 'status ' + type;
      el.textContent = message;
    }

    function severityClass(severity) {
      const s = (severity || 'Info').toLowerCase();
      if (s === 'critical') return 'badge-critical';
      if (s === 'high') return 'badge-high';
      if (s === 'medium') return 'badge-medium';
      if (s === 'low') return 'badge-low';
      return 'badge-info';
    }

    function sanitizeMermaid(raw) {
      if (typeof raw !== 'string' || !raw.trim()) {
        return 'graph TD\nA[Attacker] --> B[Contract]\nB --> C[Exploit]';
      }

      let cleaned = raw
        .replace(/```(?:mermaid)?/gi, '')
        .replace(/```/g, '')
        .replace(/`/g, '')
        .replace(/<[^>]*>/g, '')
        .replace(/javascript\s*:/gi, '')
        .replace(/\\n/g, '\n')
        .replace(/\r/g, '\n')
        .trim();

      // Simplify node labels: strip chars Mermaid often rejects inside []
      cleaned = cleaned.replace(/\[([^\]]*)\]/g, function (_, label) {
        const safe = String(label)
          .replace(/[(){}\[\]"'`<>:;]/g, ' ')
          .replace(/[^\w\s.-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 40) || 'step';
        return '[' + safe + ']';
      });

      const lines = cleaned
        .split('\n')
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return line.length > 0; });

      cleaned = lines.join('\n');

      if (!/^(graph|flowchart)\s+(TD|TB|LR|RL)/i.test(cleaned)) {
        cleaned = 'graph TD\n' + cleaned;
      }

      if (cleaned.length < 12) {
        return 'graph TD\nA[Attacker] --> B[Vulnerable contract]\nB --> C[Exploit step]';
      }

      return cleaned;
    }

    function createFindingCard(finding, index) {
      const card = document.createElement('article');
      card.className = 'finding';

      const top = document.createElement('div');
      top.className = 'finding-top';

      const badge = document.createElement('span');
      badge.className = 'badge ' + severityClass(finding.severity);
      badge.textContent = finding.severity || 'Info';

      const title = document.createElement('h3');
      title.textContent = (index + 1) + '. ' + (finding.title || 'Potential issue');

      top.appendChild(badge);
      top.appendChild(title);
      card.appendChild(top);

      const fields = [
        ['What happens', finding.what_happens],
        ['Why it matters', finding.why_it_matters],
        ['What to do', finding.what_to_do]
      ];

      fields.forEach(function (pair) {
        const label = pair[0];
        const value = pair[1];
        const row = document.createElement('div');
        row.className = 'field';
        const strong = document.createElement('strong');
        strong.textContent = label;
        const p = document.createElement('p');
        p.textContent = value || '—';
        row.appendChild(strong);
        row.appendChild(p);
        card.appendChild(row);
      });

      const diagramWrap = document.createElement('div');
      diagramWrap.className = 'diagram-wrap';
      const host = document.createElement('div');
      host.className = 'mermaid-output';
      diagramWrap.appendChild(host);
      card.appendChild(diagramWrap);

      return { card: card, host: host, source: sanitizeMermaid(finding.mermaid_diagram) };
    }

    async function renderMermaid(host, source) {
      try {
        const id = 'mmd-' + Math.random().toString(36).slice(2);
        const result = await mermaid.render(id, source);
        host.innerHTML = result.svg;
      } catch (err) {
        console.error('Mermaid render failed', err, source);
        host.innerHTML =
          '<p style="color:#9aa8b8;margin:0;font-size:0.9rem;">Diagram unavailable for this finding.</p>';
      }
    }

    async function analyzeContract() {
      const code = document.getElementById('solidityInput').value;
      const btn = document.getElementById('analyzeBtn');
      const results = document.getElementById('results');
      const findingsEl = document.getElementById('findings');
      const summaryText = document.getElementById('summaryText');

      if (!code.trim()) {
        showStatus('error', 'Please paste some Solidity code first.');
        return;
      }

      btn.disabled = true;
      clearStatus();
      showStatus('loading', 'AI is analyzing the contract…');
      results.style.display = 'none';
      findingsEl.innerHTML = '';
      summaryText.textContent = '';

      try {
        const response = await fetch(getBackendUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ solidity_code: code })
        });

        if (!response.ok) {
          let detail = 'Backend failed to respond.';
          try {
            const body = await response.json();
            detail = body.detail || detail;
          } catch (_) {
            const text = await response.text();
            if (text) detail = text;
          }
          throw new Error(detail);
        }

        const data = await response.json();
        const findings = Array.isArray(data.findings) ? data.findings : [];
        summaryText.textContent = typeof data.summary === 'string'
          ? data.summary
          : 'No summary provided.';

        if (findings.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No vulnerabilities were detected in this contract.';
          findingsEl.appendChild(empty);
        } else {
          for (let i = 0; i < findings.length; i++) {
            const built = createFindingCard(findings[i], i);
            findingsEl.appendChild(built.card);
            await renderMermaid(built.host, built.source);
          }
        }

        clearStatus();
        results.style.display = 'block';
      } catch (err) {
        showStatus('error', err.message || 'Something went wrong.');
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
